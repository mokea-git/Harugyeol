name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hrg-bk' }}

jobs:
  deploy:
    name: Docker deploy to self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify server environment
        run: |
          test -f "$DEPLOY_PATH/.env" || {
            echo "::error::.env is missing in $DEPLOY_PATH. Create it on the server before deployment."
            exit 1
          }
          command -v docker >/dev/null 2>&1 || {
            echo "::error::Docker is not installed on the self-hosted runner."
            exit 1
          }
          docker compose version >/dev/null 2>&1 || {
            echo "::error::Docker Compose v2 is not available on the self-hosted runner."
            exit 1
          }

      - name: Publish source files
        run: |
          mkdir -p "$DEPLOY_PATH"
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            ./ \
            "$DEPLOY_PATH"/

      - name: Build Docker image
        working-directory: ${{ env.DEPLOY_PATH }}
        run: docker compose build --pull

      - name: Start Docker service
        working-directory: ${{ env.DEPLOY_PATH }}
        run: docker compose up -d --remove-orphans

      - name: Prune old Docker images
        run: docker image prune -f
