name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hrg-bk' }}
  IMAGE_NAME: ghcr.io/mokea-studio/hrg-bk

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy image to self-hosted runner
    needs: build-and-push
    runs-on: [self-hosted, macOS, ARM64, docker]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker config
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Configure GitHub Container Registry auth
        run: |
          auth="$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)"
          cat > "$DOCKER_CONFIG/config.json" <<EOF
          {
            "auths": {
              "ghcr.io": {
                "auth": "$auth"
              }
            }
          }
          EOF

      - name: Provision runtime env
        run: |
          mkdir -p "$DEPLOY_PATH"
          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            {
              printf 'PORT=%s\n' '${{ secrets.PORT }}'
              printf 'HOST=0.0.0.0\n'
              printf 'APP_AUTH_CALLBACK_URL=io.supabase.harugyeol://login-callback\n'
              printf 'POSTGRES_URL=%s\n' '${{ secrets.POSTGRES_URL }}'
              printf 'SUPABASE_URL=%s\n' '${{ secrets.SUPABASE_URL }}'
              printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}'
              printf 'ANTHROPIC_API_KEY=%s\n' '${{ secrets.ANTHROPIC_API_KEY }}'
              printf 'RESEND_API_KEY=%s\n' '${{ secrets.RESEND_API_KEY }}'
              printf 'RESEND_FROM=%s\n' '${{ secrets.RESEND_FROM }}'
            } > "$DEPLOY_PATH/.env"
          fi

      - name: Verify server environment
        run: |
          test -f "$DEPLOY_PATH/.env" || {
            echo "::error::.env is missing in $DEPLOY_PATH. Create it on the server before deployment."
            exit 1
          }
          command -v docker >/dev/null 2>&1 || {
            echo "::error::Docker is not installed on the self-hosted runner."
            exit 1
          }
          if docker compose version >/dev/null 2>&1; then
            echo "COMPOSE_CMD=docker compose" >> "$GITHUB_ENV"
          elif command -v docker-compose >/dev/null 2>&1; then
            docker_host=""
            for candidate in "$HOME/.docker/run/docker.sock" "$HOME/.colima/default/docker.sock" "/var/run/docker.sock"; do
              if [ -S "$candidate" ]; then
                docker_host="unix://$candidate"
                break
              fi
            done
            if [ -z "$docker_host" ]; then
              docker_host="$(docker context inspect --format '{{ (index .Endpoints "docker").Host }}' 2>/dev/null || true)"
            fi
            if [ -n "$docker_host" ]; then
              echo "DOCKER_HOST=$docker_host" >> "$GITHUB_ENV"
            fi
            echo "COMPOSE_CMD=docker-compose" >> "$GITHUB_ENV"
          else
            echo "::error::Docker Compose is not available on the self-hosted runner."
            exit 1
          fi

      - name: Publish source files
        run: |
          mkdir -p "$DEPLOY_PATH"
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            ./ \
            "$DEPLOY_PATH"/

      - name: Stop previous runtime
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          docker rm -f hrg-bk >/dev/null 2>&1 || true
          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete hrg-bk >/dev/null 2>&1 || true
            pm2 delete harugyeol-server >/dev/null 2>&1 || true
            pm2 save >/dev/null 2>&1 || true
          fi
          set -a
          . "$DEPLOY_PATH/.env"
          set +a
          port="${PORT:-3000}"
          pids="$(lsof -tiTCP:"$port" -sTCP:LISTEN || true)"
          if [ -n "$pids" ]; then
            kill $pids || true
            sleep 2
            pids="$(lsof -tiTCP:"$port" -sTCP:LISTEN || true)"
            if [ -n "$pids" ]; then
              kill -9 $pids || true
            fi
          fi

      - name: Pull Docker image
        working-directory: ${{ env.DEPLOY_PATH }}
        run: IMAGE_NAME="${{ env.IMAGE_NAME }}:latest" $COMPOSE_CMD pull

      - name: Start Docker service
        working-directory: ${{ env.DEPLOY_PATH }}
        run: IMAGE_NAME="${{ env.IMAGE_NAME }}:latest" $COMPOSE_CMD up -d --remove-orphans

      - name: Prune old Docker images
        run: docker image prune -f
