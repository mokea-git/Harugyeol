name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hrg-bk' }}

jobs:
  deploy:
    name: Deploy to self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish build files
        run: |
          mkdir -p "$DEPLOY_PATH"
          rsync -a --delete \
            --exclude '.env' \
            dist package.json package-lock.json ecosystem.config.cjs \
            "$DEPLOY_PATH"/

      - name: Install production dependencies
        working-directory: ${{ env.DEPLOY_PATH }}
        run: npm ci --omit=dev

      - name: Verify runtime env
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          test -f .env || {
            echo "::error::.env is missing in $DEPLOY_PATH. Create it on the server before deployment."
            exit 1
          }

      - name: Restart app with PM2
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi
          pm2 startOrReload ecosystem.config.cjs --env production
          pm2 save
