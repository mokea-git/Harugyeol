name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hrg-bk' }}
  IMAGE_NAME: ghcr.io/mokea-studio/hrg-bk

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy image to self-hosted runner
    needs: build-and-push
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify server environment
        run: |
          test -f "$DEPLOY_PATH/.env" || {
            echo "::error::.env is missing in $DEPLOY_PATH. Create it on the server before deployment."
            exit 1
          }
          command -v docker >/dev/null 2>&1 || {
            echo "::error::Docker is not installed on the self-hosted runner."
            exit 1
          }
          docker compose version >/dev/null 2>&1 || {
            echo "::error::Docker Compose v2 is not available on the self-hosted runner."
            exit 1
          }

      - name: Publish source files
        run: |
          mkdir -p "$DEPLOY_PATH"
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            ./ \
            "$DEPLOY_PATH"/

      - name: Pull Docker image
        working-directory: ${{ env.DEPLOY_PATH }}
        run: IMAGE_NAME="${{ env.IMAGE_NAME }}:latest" docker compose pull

      - name: Start Docker service
        working-directory: ${{ env.DEPLOY_PATH }}
        run: IMAGE_NAME="${{ env.IMAGE_NAME }}:latest" docker compose up -d --remove-orphans

      - name: Prune old Docker images
        run: docker image prune -f
